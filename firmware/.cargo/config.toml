# Milestone E firmware build config. Cortex-M4F → the hard-float (`eabihf`) ABI so the
# FPU is used. Add the target before building: `rustup target add thumbv7em-none-eabihf`.
[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# Link against the cortex-m-rt linker script (`link.x`), which pulls in `memory.x`.
rustflags = ["-C", "link-arg=-Tlink.x"]
# Flash/run on real hardware (Milestone E); Renode runs the ELF directly instead.
runner = "probe-rs run --chip STM32F411RETx"
