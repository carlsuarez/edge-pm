[workspace]
members = ["pmcore"]
# `firmware` is a no_std Cortex-M4F binary with its own compile target and linker
# script, so it is excluded from the default workspace — `cargo build`/`test` at the
# root stay host-native and fast. Build it explicitly from inside its own directory:
# `cd firmware && cargo build`.
exclude = ["firmware"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["edge-pm"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
